name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siren_head_the_watching_trees.zip
        run: |
          if [ ! -f gradlew ]; then
            Z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n1)
            echo "zip: $Z"
            if [ -n "$Z" ]; then mkdir -p _proj && unzip -q "$Z" -d _proj; fi
          fi
          G=$(find . -name gradlew -not -path './.git/*' | head -n1)
          if [ -z "$G" ]; then echo "gradlew tidak ketemu. Isi repo:"; ls -R | head -60; exit 1; fi
          echo "PROJ=$(dirname "$G")" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Siren_head_the_watching_trees-jar
          path: ${{ env.PROJ }}/build/libs/*.jar
